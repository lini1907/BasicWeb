<html>
<head>
    <title></title>

    <script>
        function findMax()
        {
            let a = Number(document.getElementById("a").value);
            let b = Number(document.getElementById("b").value);
            let c = Number(document.getElementById("c").value);

            document.getElementById("result").value =
            Math.max(a,b,c);
        }

        function findMin()
        {
            let a = Number(document.getElementById("a").value);
            let b = Number(document.getElementById("b").value);
            let c = Number(document.getElementById("c").value);

            document.getElementById("result").value =
            Math.min(a,b,c);
        }

        function sinA()
        {
            let a = Number(document.getElementById("a").value);

            document.getElementById("result").value =
            Math.sin(a);
        }

        function cosA()
        {
            let a = Number(document.getElementById("a").value);

            document.getElementById("result").value =
            Math.cos(a);
        }

        function powerAB()
        {
            let a = Number(document.getElementById("a").value);
            let b = Number(document.getElementById("b").value);

            document.getElementById("result").value =
            Math.pow(a,b);
        }
    </script>
</head>

<body>

<table border="1">
    <tr>
        <td>a:</td>
        <td><input type="text" id="a"></td>
    </tr>

    <tr>
        <td>b:</td>
        <td><input type="text" id="b"></td>
    </tr>

    <tr>
        <td>c:</td>
        <td><input type="text" id="c"></td>
    </tr>

    <tr>
        <td>Result:</td>
        <td><input type="text" id="result"></td>
    </tr>

    <tr>
        <td colspan="2">
            <button onclick="findMax()">MAX</button>
            <button onclick="findMin()">MIN</button>
            <button onclick="sinA()">sin(a)</button>
            <button onclick="cosA()">cos(a)</button>
            <button onclick="powerAB()">a^b</button>
        </td>
    </tr>
</table>

</body>
</html>
